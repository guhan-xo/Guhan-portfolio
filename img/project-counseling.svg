<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Student counseling analytics preview</title>
  <desc id="desc">An analytics interface showing student risk signals and a counseling conversation.</desc>
  <rect width="800" height="440" fill="#171229"/>
  <rect x="28" y="28" width="744" height="52" rx="5" fill="#221a3d" stroke="#59478e"/><circle cx="54" cy="54" r="8" fill="#b88cff"/><text x="76" y="60" fill="#f7f2ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">STUDENT SUPPORT / INSIGHTS</text><text x="647" y="59" fill="#b88cff" font-family="Arial,sans-serif" font-size="12">Q3 REVIEW</text>
  <rect x="28" y="106" width="260" height="290" rx="5" fill="#211a38" stroke="#59478e"/><text x="48" y="136" fill="#9f91bc" font-family="Arial,sans-serif" font-size="11">RISK OVERVIEW</text><text x="48" y="181" fill="#f7f2ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">18.4%</text><text x="48" y="204" fill="#b88cff" font-family="Arial,sans-serif" font-size="12">students need support</text><path d="M48 340 88 307l36 16 44-60 43 25 42-81" fill="none" stroke="#b88cff" stroke-width="5"/><path d="M48 340 88 307l36 16 44-60 43 25 42-81V362H48Z" fill="#573fa0" opacity=".18"/><text x="48" y="370" fill="#756a8c" font-family="Arial,sans-serif" font-size="10">AUG      SEP      OCT      NOV</text>
  <rect x="314" y="106" width="458" height="290" rx="5" fill="#211a38" stroke="#59478e"/><text x="338" y="136" fill="#9f91bc" font-family="Arial,sans-serif" font-size="11">COUNSELING ASSISTANT</text><rect x="338" y="158" width="266" height="44" rx="8" fill="#302652"/><text x="354" y="185" fill="#eee7ff" font-family="Arial,sans-serif" font-size="13">I have been missing classes lately.</text><rect x="446" y="220" width="300" height="56" rx="8" fill="#775cc3"/><text x="464" y="245" fill="#fff" font-family="Arial,sans-serif" font-size="13">Let's find a plan that works for you.</text><text x="464" y="264" fill="#d7c8fa" font-family="Arial,sans-serif" font-size="11">supportive response generated</text><rect x="338" y="320" width="408" height="42" rx="5" fill="#18132b" stroke="#59478e"/><text x="356" y="347" fill="#756a8c" font-family="Arial,sans-serif" font-size="12">Type a message...</text><circle cx="720" cy="341" r="12" fill="#b88cff"/>
</svg>
